<div class="product-container">
    <h2>
        <a href="{{ product.get_absolute_url }}" class="product-link">
            {{ product.title }}
        </a>
    </h2>
    {% comment %} <p class="product-category">
        <strong>Категория:</strong> {{ product.category }}
    </p> {% endcomment %}
    <p class="product-text">
        <strong>Описание товара:</strong> {{ product.text }}
    </p>
    <p class="product-country">
        <strong>Страна происхождения:</strong> {{ product.country }}
    </p>
    <p class="product-price">
        <strong>Цена:</strong> {{ product.price }} ₽
    </p>
    <small>Дата добавления товара: {{ product.created_at|date:"d.m.Y H:i" }}</small>
</div>
